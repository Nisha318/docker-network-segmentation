<svg width="680" height="596" viewBox="0 0 680 596" xmlns="http://www.w3.org/2000/svg" style="font-family:sans-serif">
  <title>Stage 2 Docker networking architecture</title>

  <!-- Zone: frontend_net -->
  <rect x="130" y="100" width="420" height="106" rx="14" fill="#EBF4FD" stroke="#378ADD" stroke-width="0.75" stroke-dasharray="5 3"/>
  <text x="538" y="114" font-size="12" text-anchor="end" fill="#185FA5">frontend_net</text>

  <!-- Zone: backend_net -->
  <rect x="130" y="278" width="420" height="188" rx="14" fill="#E6F5EF" stroke="#1D9E75" stroke-width="0.75" stroke-dasharray="5 3"/>
  <text x="538" y="292" font-size="12" text-anchor="end" fill="#0F6E56">backend_net</text>

  <!-- Zone: none network — clearly separated from backend_net -->
  <rect x="130" y="500" width="200" height="76" rx="14" fill="#F4F3F0" stroke="#888780" stroke-width="0.75" stroke-dasharray="5 3"/>
  <text x="160" y="493" font-size="12" text-anchor="start" fill="#5F5E5A">none network</text>

  <!-- Host -->
  <rect x="260" y="24" width="160" height="40" rx="6" fill="#E8E7E1" stroke="#888780" stroke-width="0.75"/>
  <text x="340" y="48" font-size="14" font-weight="500" text-anchor="middle" fill="#2C2C2A">Host</text>

  <!-- Arrow: Host to Nginx -->
  <line x1="340" y1="64" x2="340" y2="116" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="352" y="88" font-size="12" text-anchor="start" fill="#5F5E5A">:80</text>

  <!-- Nginx -->
  <rect x="220" y="116" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
  <text x="340" y="138" font-size="14" font-weight="500" text-anchor="middle" fill="#0C447C">nginx</text>
  <text x="340" y="158" font-size="12" text-anchor="middle" fill="#185FA5">172.30.0.10</text>

  <!-- Arrow: Nginx to flask_api -->
  <line x1="340" y1="172" x2="340" y2="214" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- flask_api -->
  <rect x="220" y="214" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
  <text x="340" y="236" font-size="14" font-weight="500" text-anchor="middle" fill="#3C3489">flask_api</text>
  <text x="340" y="256" font-size="12" text-anchor="middle" fill="#534AB7">172.30.0.20 / 172.31.0.20</text>

  <!-- Arrows: flask_api to redis_cache and postgres_db -->
  <line x1="300" y1="270" x2="238" y2="296" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="380" y1="270" x2="442" y2="296" stroke="#888780" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- redis_cache -->
  <rect x="148" y="296" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="238" y="318" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">redis_cache</text>
  <text x="238" y="338" font-size="12" text-anchor="middle" fill="#0F6E56">172.31.0.11</text>

  <!-- postgres_db -->
  <rect x="352" y="296" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
  <text x="442" y="318" font-size="14" font-weight="500" text-anchor="middle" fill="#085041">postgres_db</text>
  <text x="442" y="338" font-size="12" text-anchor="middle" fill="#0F6E56">172.31.0.10</text>

  <!-- admin_probe -->
  <rect x="148" y="508" width="164" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
  <text x="230" y="530" font-size="14" font-weight="500" text-anchor="middle" fill="#444441">admin_probe</text>
  <text x="230" y="550" font-size="12" text-anchor="middle" fill="#5F5E5A">loopback only</text>

  <!-- Blocked path: nginx cannot reach backend_net -->
  <path d="M 220 144 L 80 144 L 80 324 L 130 324" fill="none" stroke="#E24B4A" stroke-width="0.75" stroke-dasharray="5 3"/>
  <line x1="123" y1="317" x2="137" y2="331" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="137" y1="317" x2="123" y2="331" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round"/>
  <text x="105" y="344" font-size="12" text-anchor="middle" fill="#E24B4A">no route</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
